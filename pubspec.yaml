name: soundkid
description: "SoundKid - App de efeitos sonoros para histórias infantis"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^5.2.1
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  speech_to_text: ^7.0.0
  record: ^5.1.2
  supabase_flutter: ^2.8.0
  video_player: ^2.9.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  record_linux: 1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/audio/
    - assets/images/